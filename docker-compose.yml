services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: goldzone_root
      MYSQL_DATABASE: goldzone
      MYSQL_USER: goldzone
      MYSQL_PASSWORD: goldzone_dev
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports: ["3307:3306"]
    volumes: ["goldzone_mysql:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ugoldzone", "-pgoldzone_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://goldzone:goldzone_dev@mysql:3306/goldzone
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-secret-change-before-production-123456}
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_DAYS: 30
      FRONTEND_ORIGIN: http://localhost:8080
    ports: ["3001:3000"]
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
  frontend:
    build:
      context: ../goldzone-fe
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    ports: ["8080:80"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  goldzone_mysql:
