services:
  - type: web
    name: goldzone-backend
    env: docker
    # LƯU Ý: gói free ngủ sau ~15 phút không có request, worker đọc email cũng
    # ngủ theo. Không mất giao dịch (lần thức dậy sau vẫn quét thư CHƯA ĐỌC
    # trong EMAIL_LOOKBACK_DAYS ngày), nhưng tiền vào có thể chậm hàng giờ.
    # Muốn cộng tiền trong vòng 1 phút thì phải lên gói trả phí.
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        value: mysql://3f88VeV8J4CXs9C.root:iIcJhD13NgCTIVmI@gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/goldzone?sslaccept=strict
      - key: JWT_ACCESS_SECRET
        value: goldzone-super-secret-jwt-key-minimum-32-chars-prod-2026
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_DAYS
        value: "30"
      - key: FRONTEND_ORIGIN
        value: https://betting-fe-sable.vercel.app
      - key: FISH_ROOM_CAPACITY
        value: "6"
      - key: FISH_READY_TO_START
        value: "4"
      - key: FISH_START_COUNTDOWN_MS
        value: "30000"

      # Hạn mức rút tiền
      - key: WITHDRAW_MIN
        value: "50000"
      - key: WITHDRAW_MAX
        value: "100000000"

      # Worker đọc email báo có của Timo (SRS mục 18).
      - key: EMAIL_READER_ENABLED
        value: "1"
      - key: IMAP_HOST
        value: imap.gmail.com
      - key: IMAP_PORT
        value: "993"
      - key: IMAP_SECURE
        value: "1"
      - key: IMAP_MAILBOX
        value: INBOX
      - key: EMAIL_SENDER_FILTER
        value: timo.vn
      - key: EMAIL_POLL_INTERVAL_MS
        value: "60000"
      - key: EMAIL_LOOKBACK_DAYS
        value: "7"
      - key: IMAP_USER
        value: lyhotuanan2004@gmail.com
      - key: IMAP_PASSWORD
        value: czuq lhfe laad dyeh
